name: Build

on:
  push:
    # Only release tags build — main pushes never spend Actions minutes.
    tags: ["v*"]
  workflow_dispatch:

# One build at a time; a newer tag cancels the stale run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ARM
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        # The runner's Xcode is complete, so the local toolchain shim is
        # skipped automatically (build-app.sh checks xcode-select).
        # One retry: SwiftPM fetches the MPVKit binary target over the
        # network and a transient failure aborts the build.
        run: |
          ./scripts/build-app.sh release || (
            echo "::warning::build failed, retrying once (likely a transient SwiftPM fetch failure)"
            sleep 20
            ./scripts/build-app.sh release
          )

      - name: Create dmg
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.0.5"  # workflow_dispatch: no tag
          APP="build/BrushLLM Player.app"
          DMG="build/BrushLLM.Player-$VERSION-arm64.dmg"
          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "BrushLLM Player" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Player-macos-arm64
          if-no-files-found: error
          path: build/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/release-notes.md << EOF
          An open-source cross-platform media player built on mpv — plays virtually every format, streams from WebDAV / SMB / FTP / Emby / Jellyfin, and ships a 9-language UI.

          ## What's new in ${VERSION} (macOS app)

          - **Browser sorting** — sort media server folders by name, modified date, or size; pick the same option again to flip ascending/descending. Works across WebDAV, SMB, FTP, Emby and Jellyfin.
          - **Folder to playlist** — right-click a folder in the browser and choose "Add to Playlist" to enqueue every playable file inside it, then the playlist panel opens automatically.
          - **Smoother WebDAV streaming on 115/OpenList** — the server's redirect is resolved once when a playlist entry starts, so pausing and seeking no longer re-trigger it.

          ## Downloads

          | Your system | Download |
          |---|---|
          | **macOS** — Apple Silicon (M-series) | \`BrushLLM.Player-${VERSION}-arm64.dmg\` |
          | **Windows 10/11** — x64 (Intel / AMD) | \`BrushLLM.Player-${VERSION}-x64.exe\` |
          | **Windows 10/11** — ARM64 (Snapdragon) | \`BrushLLM.Player-${VERSION}-arm64.exe\` |

          ## First run (apps are unsigned)

          - **macOS — Gatekeeper**: open the \`.dmg\`, drag **BrushLLM Player** into *Applications*, then **right-click the app and choose “Open”** (a plain double-click is blocked the first time). Confirm “Open” in the dialog.
          - **Windows — SmartScreen**: run the \`.exe\` matching your CPU; when SmartScreen shows “Windows protected your PC”, choose **“Run anyway”**. The installer opens with a language selector (9 languages) and bundles mpv — no extra downloads needed.

          ## Features

          - **Playback** — every mpv-supported format, hardware decoding, HDR output, A-B loop, speed control, frame stepping
          - **Media servers** — WebDAV, SMB, FTP, Emby and Jellyfin; sortable browser and folder-to-playlist
          - **Network streams** — HTTP(S) direct links and m3u8/HLS
          - **Subtitles** — auto-load matching files, external loading, live styling
          - **9-language UI** with instant switching, manual update checks

          The Windows app (cross-platform rewrite) currently covers playback, controls and file opening; the remaining macOS features are being migrated.

          ## Notes

          - Apps are unsigned — expect the first-run warnings described above.
          - Licensed under GPL v3 (mpv / libmpv licensing).
          EOF
      - name: Update release
        # gh CLI instead of softprops: the action's read-modify-write of the
        # release body repeatedly failed to persist the new notes on this
        # repo. gh release edit applies the notes file deterministically.
        # --draft=false matters: deleting a git tag converts its releases
        # to drafts, and gh release edit finds drafts but does not publish
        # them unless told to.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          TITLE="BrushLLM Player $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/release-notes.md --draft=false
            gh release upload "$TAG" artifacts/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/release-notes.md artifacts/*.dmg
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
