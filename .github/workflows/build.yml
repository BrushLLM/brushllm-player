name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows-x64, windows-arm64]
      publish:
        description: Publish a new release from main after all three builds succeed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: player-build-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.check.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and release target
        id: check
        env:
          PLATFORM: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          npm = json.loads(Path("tauri/package.json").read_text())["version"]
          tauri = json.loads(Path("tauri/src-tauri/tauri.conf.json").read_text())["version"]
          rust = tomllib.loads(Path("tauri/src-tauri/Cargo.toml").read_text())["package"]["version"]
          if npm != tauri or npm != rust:
              raise SystemExit("npm, Tauri and Cargo versions must agree")
          print(tauri)
          PY
          )
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag must match the application version v$version"
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || "$PLATFORM" != all ]]; then
              echo "::error::Publishing requires main and all platforms"
              exit 1
            fi
            if git ls-remote --exit-code origin "refs/tags/v$version"; then
              echo "::error::Tag v$version already exists"
              exit 1
            else
              status=$?
              [[ "$status" == 2 ]] || exit "$status"
            fi
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64
    needs: version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Swift application and disk image
        run: bash scripts/package-macos.sh release --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Player-macos-arm64
          if-no-files-found: error
          path: build/BrushLLM.Player-${{ needs.version.outputs.number }}-arm64.dmg

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    if: github.event_name == 'push' || inputs.platform == 'all' || startsWith(inputs.platform, 'windows-')
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.platform == 'windows-x64' && '["x64"]' || inputs.platform == 'windows-arm64' && '["arm64"]' || '["x64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        working-directory: tauri
    env:
      RUST_TARGET: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          key: ${{ env.RUST_TARGET }}
      - run: npm ci
      - name: Bundle mpv for the target architecture
        shell: pwsh
        run: |
          $mpvVersion = "v0.41.0"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-$env:RUST_TARGET.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "mpv-$env:RUST_TARGET"
          curl.exe --fail --silent --show-error --location --retry 2 `
            "https://github.com/mpv-player/mpv/releases/download/$mpvVersion/mpv-$mpvVersion-$env:RUST_TARGET.zip" `
            --output "$archive"
          if ($LASTEXITCODE -ne 0) { throw "mpv download failed" }
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          $mpv = @(Get-ChildItem $unpacked -Recurse -File -Filter mpv.exe)
          if ($mpv.Count -ne 1) { throw "Expected one mpv.exe in the archive" }
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Copy-Item $mpv[0].FullName src-tauri/bin/
          Get-ChildItem $unpacked -Recurse -File -Filter *.dll | Copy-Item -Destination src-tauri/bin/
      - name: Build the NSIS installer
        run: npm run tauri -- build --target $env:RUST_TARGET --bundles nsis -- --locked
      - name: Stage installer
        env:
          VERSION: ${{ needs.version.outputs.number }}
          ARCH: ${{ matrix.arch }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/$env:RUST_TARGET/release/bundle/nsis" -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          New-Item -ItemType Directory -Force installers | Out-Null
          Copy-Item $installers[0].FullName "installers/BrushLLM.Player-$env:VERSION-$env:ARCH.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: BrushLLM-Player-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: tauri/installers/BrushLLM.Player-${{ needs.version.outputs.number }}-${{ matrix.arch }}.exe

  release:
    if: github.event_name == 'push' || inputs.publish
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BrushLLM-Player-*
          path: artifacts
          merge-multiple: true
      - name: Publish the three installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
        shell: bash
        run: |
          tag="v$VERSION"
          files=(
            "artifacts/BrushLLM.Player-$VERSION-arm64.dmg"
            "artifacts/BrushLLM.Player-$VERSION-x64.exe"
            "artifacts/BrushLLM.Player-$VERSION-arm64.exe"
          )
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing installer $file"
              exit 1
            fi
          done

          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field "ref=refs/tags/$tag" --raw-field "sha=$GITHUB_SHA" --silent
          fi
          git fetch --no-tags origin "refs/tags/$tag"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::$tag does not point to the commit used for these installers"
            exit 1
          fi
          notes=(--generate-notes)
          if [[ -f ".github/release-notes/$tag.md" ]]; then
            notes=(--notes-file ".github/release-notes/$tag.md")
          fi
          gh release create "$tag" --verify-tag "${notes[@]}" \
            --title "BrushLLM Player $tag" "${files[@]}"
          gh release view "$tag" --json url,assets --jq '{url, assets: [.assets[].name]}'
