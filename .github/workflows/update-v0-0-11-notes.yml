name: Update Player v0.0.11 release notes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'BrushLLM/brushllm-player' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the installers and update the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=v0.0.11
          downloads="$RUNNER_TEMP/player-v0.0.11"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$downloads" \
            --pattern 'BrushLLM.Player-0.0.11-*'
          (
            cd "$downloads"
            sha256sum --check <<'CHECKSUMS'
          6961dfe4a4694294fa68347f0a6d9558ad2b46434312d0f97188ef4a5bc8c598  BrushLLM.Player-0.0.11-arm64.dmg
          9e92ee1e16d586cb386db5358772ae37289b4c1e5751c97898a329a4bd2a21eb  BrushLLM.Player-0.0.11-arm64.exe
          c0b2a6eadf5ebfff8c9ff54500dd99974a9679218c4d240c714aaf6879aa887f  BrushLLM.Player-0.0.11-x64.exe
          CHECKSUMS
          )
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --notes-file .github/release-notes/v0.0.11.md
