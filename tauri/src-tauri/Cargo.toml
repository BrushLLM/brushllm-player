[package]
name = "brushllm-player"
version = "0.0.9"
edition = "2021"

[lib]
name = "brushllm_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
# Media-server clients (WebDAV/FTP/Emby): lightweight blocking HTTP for
# user-triggered browse/auth calls (spawn_blocking), streaming XML and Basic
# auth encoding. FTP and SMB use std::net / std::process directly.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
quick-xml = "0.36"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSView", "NSWindow"] }

[profile.release]
lto = "thin"
